name: Deploy site

# Runs on every push to main, and when the API asks for a rebuild after the
# owner publishes something in the admin (workflow_dispatch, see
# backend/src/lib/publish.js). The build reads her content from the live API.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer request replaces any that's still queued, so a
# burst of publishes ends in a single build of the latest content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # The project URL lives under /creative-vision-consultancy/. Set the repo
      # variable BASE_PATH to "/" once the custom domain is connected.
      BASE_PATH: ${{ vars.BASE_PATH || '/creative-vision-consultancy/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
